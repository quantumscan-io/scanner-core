name: 'QuantumScan'
description: 'Post-quantum cryptography (PQC) vulnerability scanner — detect quantum-vulnerable algorithms, weak entropy, and hardcoded keys before Q-Day'
author: 'quantumscan-io'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory to scan (default: repository root)'
    required: false
    default: '.'
  fail-on:
    description: >
      What fails the action. Layer mode (preferred): security | exposure | never.
      "security" fails only on findings where a reachable primitive controls an
      identified authority. "exposure" also fails on migration surface.
      Severity mode (legacy): critical | high | medium | low.
    required: false
    default: 'security'
  substrate:
    description: 'Enable Substrate/Polkadot PQC patterns (sr25519, BABE, GRANDPA, XCM, ink!, schnorrkel)'
    required: false
    default: 'false'
  no-deps:
    description: 'Skip dependency manifest scanning (package.json, Cargo.toml, go.mod, requirements.txt…)'
    required: false
    default: 'false'
  sarif-output:
    description: 'Write SARIF 2.1.0 report to this path — enables GitHub Security tab integration'
    required: false
    default: ''

outputs:
  risk-score:
    description: 'Risk score 0–100, computed from the security-critical layer only'
    value: ${{ steps.scan.outputs.risk-score }}
  exposure-score:
    description: 'Migration surface score 0–100 — planning signal, not a vulnerability count'
    value: ${{ steps.scan.outputs.exposure-score }}
  security-critical:
    description: 'Findings where a reachable primitive controls an identified authority'
    value: ${{ steps.scan.outputs.security-critical }}
  migration-exposure:
    description: 'Findings that must eventually be replaced — not demonstrated vulnerabilities'
    value: ${{ steps.scan.outputs.migration-exposure }}
  inventory:
    description: 'Cryptographic inventory entries — primitive present, no reachable authority established'
    value: ${{ steps.scan.outputs.inventory }}
  residual-classical-bypass:
    description: 'true when post-quantum verification exists but a classical key can still authorize or replace it'
    value: ${{ steps.scan.outputs.residual-classical-bypass }}
  migration-status:
    description: 'inventory-only | pq-capable | hybrid | classical-disabled | end-to-end-blocked'
    value: ${{ steps.scan.outputs.migration-status }}
  critical:
    description: 'Number of critical findings (severity computed from context)'
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: 'Number of high findings (severity computed from context)'
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: 'Number of medium findings (severity computed from context)'
    value: ${{ steps.scan.outputs.medium }}

runs:
  using: 'composite'
  steps:
    - name: QuantumScan PQC analysis
      id: scan
      shell: bash
      run: |
        node "${{ github.action_path }}/action-runner.mjs" \
          "${{ inputs.path }}" \
          "${{ inputs.fail-on }}" \
          "${{ inputs.sarif-output }}" \
          "${{ inputs.substrate }}" \
          "${{ inputs.no-deps }}"
