name: PQC Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 6am UTC

permissions:
  security-events: write
  contents: read

jobs:
  pqc-scan:
    name: Quantum-vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # index.js IS the pattern database: its regex literals contain the
      # vulnerable algorithm names they detect, so scanning source code here
      # always self-matches as 100/100 critical. Only the dependency check
      # (package.json etc.) is meaningful for this repo.
      - name: Scan for quantum-vulnerable cryptography
        run: node index.js . --sarif --no-code --no-fail > pqc-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pqc-results.sarif
          category: post-quantum-cryptography
