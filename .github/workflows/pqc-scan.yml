name: PQC Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 6am UTC

permissions:
  security-events: write
  contents: read

jobs:
  pqc-scan:
    name: Quantum-vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for quantum-vulnerable cryptography
        run: npx --yes quantumscan@latest . --sarif --no-fail > pqc-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pqc-results.sarif
          category: post-quantum-cryptography
