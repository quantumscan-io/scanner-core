name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify CLI version
        run: node index.js --version

      - name: Scan own repo (human output)
        run: node index.js . --no-fail

      - name: Verify JSON output
        run: |
          node index.js . --json --no-fail > /tmp/scan.json
          node -e "var d=JSON.parse(require('fs').readFileSync('/tmp/scan.json','utf8'));if(!d.version||!Array.isArray(d.findings)){process.exit(1);}console.log('JSON OK:',d.findings.length,'findings');"

      - name: Verify SARIF output
        run: |
          node index.js . --sarif --no-fail > /tmp/scan.sarif
          node -e "var d=JSON.parse(require('fs').readFileSync('/tmp/scan.sarif','utf8'));if(d.version!=='2.1.0'||!d.runs){process.exit(1);}console.log('SARIF OK:',d.runs[0].results.length,'results');"

      - name: Verify --no-deps flag
        run: |
          node index.js . --json --no-deps --no-fail > /tmp/nodeps.json
          node -e "var d=JSON.parse(require('fs').readFileSync('/tmp/nodeps.json','utf8'));if(d.summary.dependencies!==0){process.exit(1);}console.log('--no-deps OK');"
